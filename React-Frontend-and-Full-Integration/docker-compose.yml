version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# Cloud Cost Optimizer — Full Stack Docker Compose
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cco-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       cloudoptimizer
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudoptimizer"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - cco-network

  # ── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cco-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - cco-network

  # ── .NET API Gateway ────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cco-api-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_HOST:                db
      DB_USER:                postgres
      DB_PASSWORD:            ${DB_PASSWORD:-postgres123}
      REDIS_URL:              "redis:6379,password=${REDIS_PASSWORD:-redis123}"
      JWT_SECRET:             ${JWT_SECRET:-SuperSecretJwtKeyChangeInProduction2024!}
      SCANNER_SERVICE_URL:    http://scanner-service:8001
      ANALYSIS_ENGINE_URL:    http://analysis-engine:8002
      SCHEDULER_SERVICE_URL:  http://scheduler-service:8003
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout:  10s
      retries:  5
      start_period: 30s
    networks:
      - cco-network

  # ── Python Scanner Service ─────────────────────────────────────────────────
  scanner-service:
    build:
      context: ./scanner-service
      dockerfile: Dockerfile
    container_name: cco-scanner
    restart: unless-stopped
    environment:
      DATABASE_URL:         "postgresql://postgres:${DB_PASSWORD:-postgres123}@db:5432/cloudoptimizer"
      ANALYSIS_ENGINE_URL:  http://analysis-engine:8002
      SIMULATE_CLOUD:       "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout:  10s
      retries:  5
      start_period: 20s
    networks:
      - cco-network

  # ── Python Analysis Engine ─────────────────────────────────────────────────
  analysis-engine:
    build:
      context: ./analysis-engine
      dockerfile: Dockerfile
    container_name: cco-analysis
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-postgres123}@db:5432/cloudoptimizer"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout:  10s
      retries:  5
      start_period: 20s
    networks:
      - cco-network

  # ── Python Scheduler Service ───────────────────────────────────────────────
  scheduler-service:
    build:
      context: ./scheduler-service
      dockerfile: Dockerfile
    container_name: cco-scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL:         "postgresql://postgres:${DB_PASSWORD:-postgres123}@db:5432/cloudoptimizer"
      SCANNER_SERVICE_URL:  http://scanner-service:8001
      SCAN_CRON_HOUR:       "*/6"
      SCAN_CRON_MINUTE:     "0"
    depends_on:
      db:
        condition: service_healthy
      scanner-service:
        condition: service_healthy
      analysis-engine:
        condition: service_healthy
    ports:
      - "8003:8003"
    networks:
      - cco-network

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: cco-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - cco-network

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────────
networks:
  cco-network:
    driver: bridge

version: "3.9"
networks:
  cco-network:
    driver: bridge
volumes:
  postgres_data:
  redis_data:

services:
  db:
    image: postgres:16-alpine
    container_name: cco-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudoptimizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./database/migrations/002_indexes_constraints.sql:/docker-entrypoint-initdb.d/002_indexes.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudoptimizer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cco-network]

  redis:
    image: redis:7-alpine
    container_name: cco-redis
    restart: unless-stopped
    command: redis-server --requirepass redis123 --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cco-network]

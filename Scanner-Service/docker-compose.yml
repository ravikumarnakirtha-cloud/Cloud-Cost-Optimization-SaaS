version: "3.9"
networks:
  cco-network:
    driver: bridge
volumes:
  postgres_data:
  redis_data:

services:
  db:
    image: postgres:16-alpine
    container_name: cco-db
    environment:
      POSTGRES_DB: cloudoptimizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./database/migrations/002_indexes_constraints.sql:/docker-entrypoint-initdb.d/002_indexes.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudoptimizer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cco-network]

  redis:
    image: redis:7-alpine
    container_name: cco-redis
    command: redis-server --requirepass redis123 --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    networks: [cco-network]

  scanner-service:
    build:
      context: ./scanner-service
      dockerfile: Dockerfile
    container_name: cco-scanner
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgres123@db:5432/cloudoptimizer"
      ANALYSIS_ENGINE_URL: "http://localhost:8002"
      SIMULATE_CLOUD: "true"
    depends_on:
      db:
        condition: service_healthy
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [cco-network]
